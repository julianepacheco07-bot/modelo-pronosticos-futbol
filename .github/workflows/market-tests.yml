name: Market helper tests

on:
  push:
    paths:
      - "src/mercados_betano.py"
      - "src/simular_europa_league.py"
      - "tests/**"
      - ".github/workflows/market-tests.yml"
  pull_request:
    paths:
      - "src/mercados_betano.py"
      - "src/simular_europa_league.py"
      - "tests/**"
      - ".github/workflows/market-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run market unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile simulation modules
        run: python -m py_compile src/mercados_betano.py src/simular_europa_league.py
